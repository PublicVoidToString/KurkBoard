<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .score-table-admin {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            border: 1px solid #41444b;
            border-radius: 8px;

            overflow: hidden;

            background: #fff2dd;
            color: #000000;

            font: inherit;
        }

        .score-table-admin th,
        .score-table-admin td {
            padding: 10px 14px;

            border-right: 1px solid #41444b;
            border-bottom: 1px solid #41444b;

            text-align: center;
            vertical-align: middle;
        }

        .score-table-admin th:last-child,
        .score-table-admin td:last-child {
            border-right: none;
        }

        .score-table-admin tr:last-child th,
        .score-table-admin tr:last-child td {
            border-bottom: none;
        }

        .score-table-admin thead th {
            background: #496839;
            color: #ffffff;
            font-weight: 700;
        }

        .score-table-admin .score-table-admin__player {
            text-align: left;
            font-weight: 700;
        }

        .score-table-admin .score-table-admin__max {
            font-weight: 700;
        }

        .score-table-admin .score-table-admin__max--active {
            background: #609060;
            color: #ffffff;
            font-weight: 700;
        }

        .score-table-admin tbody tr:hover td {
            background: #c5baaf;
        }

        .score-table-admin tbody tr:hover .score-table-admin__max--active {
            background: #409060;
        }

        .score-table-admin .score-table-admin__score-link {
            display: block;

            width: calc(100% + 28px);
            min-height: 0;

            box-sizing: border-box;

            margin: -10px -14px;
            padding: 10px 14px;

            background: transparent;
            color: inherit;

            font: inherit;
            font-weight: inherit;

            text-decoration: none;

            cursor: pointer;

            transition:
                    background 120ms ease,
                    color 120ms ease;
        }

        .score-table-admin .score-table-admin__score-link:hover {
            background: #8c8c8c;
            color: #ffffff;
        }

        .score-table-admin--compact th,
        .score-table-admin--compact td {
            padding: 7px 10px;
        }

        .score-table-admin--compact .score-table-admin__score-link {
            width: calc(100% + 20px);

            margin: -7px -10px;
            padding: 7px 10px;
        }

    </style>
</head>

<body>
</body>

</html>
