<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .score-table {
            width: fit-content;

            border-collapse: separate;
            border-spacing: 0;

            border: 1px solid #41444b;
            border-radius: 8px;

            overflow: hidden;

            background: #fff2dd;
            color: #000000;

            font: inherit;
            font-size:1.1em;
        }

        .score-table th,
        .score-table td {

            border-right: 1px solid #41444b;
            border-bottom: 1px solid #41444b;

            text-align: center;
            vertical-align: middle;
            padding: 0;
        }

        .score-table th:last-child,
        .score-table td:last-child {
            border-right: none;
        }

        .score-table tr:last-child th,
        .score-table tr:last-child td {
            border-bottom: none;
        }

        .score-table thead th {
            background: #507040;
            color: #ffffff;
            font-weight: 700;
            padding: 10px 14px;
        }

        .score-table .score-table__player {
            text-align: left;
            font-weight: 700;
            padding: 0 5px 0 5px;
        }

        .score-table .score-table__max {
            font-weight: 700;
            font-size:1.1em;
        }

        .score-table .score-table__max--active {
            background: #609060;
            color: #ffffff;
            font-weight: 700;
            font-size:1.1em;
        }

        .score-table tbody tr:hover td {
            background: #c5baaf;
        }

        .score-table tbody tr:hover .score-table__max--active {
            background: #409060;
        }

        .score-table .score-table__score-link {
            display: block;
            box-sizing: border-box;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .score-table .score-table__score-link:hover {
            background: #8c8c8c;
            color: #ffffff;
        }

    </style>
</head>

<body>
</body>

</html>
