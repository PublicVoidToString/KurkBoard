<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .score-table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            border: 1px solid #41444b;
            border-radius: 8px;

            overflow: hidden;

            background: #fff2dd;
            color: #000000;

            font: inherit;
        }

        .score-table th,
        .score-table td {
            padding: 10px 14px;

            border-right: 1px solid #41444b;
            border-bottom: 1px solid #41444b;

            text-align: center;
            vertical-align: middle;
        }

        .score-table th:last-child,
        .score-table td:last-child {
            border-right: none;
        }

        .score-table tr:last-child th,
        .score-table tr:last-child td {
            border-bottom: none;
        }

        .score-table thead th {
            background: #496839;
            color: #ffffff;
            font-weight: 700;
        }

        .score-table .score-table__player {
            text-align: left;
            font-weight: 700;
        }

        .score-table .score-table__max {
            font-weight: 700;
        }

        .score-table .score-table__max--active {
            background: #609060;
            color: #ffffff;
            font-weight: 700;
        }

        .score-table tbody tr:hover td {
            background: #c5baaf;
        }

        .score-table tbody tr:hover .score-table__max--active {
            background: #409060;
        }

        .score-table--compact th,
        .score-table--compact td {
            padding: 7px 10px;
        }

    </style>
</head>

<body>
</body>

</html>
