<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .tournament-window {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 0.5em;
            width: 100%;
        }

        .tournament-window__link {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            border: 2px solid #41444b;
            border-radius: 12px;
            background: #fff2dd;
            color: #000000;
            font: inherit;
            text-decoration: none;

            box-shadow:
                    0 3px 0 #41444b,
                    0 8px 18px rgba(0, 0, 0, 0.18);
        }

        .tournament-window__link:hover {
            border-color: #507040;

            transform: translateY(-2px);

            box-shadow:
                    0 4px 0 #507040,
                    0 2px 18px rgba(0, 0, 0, 0.16),
                    0 0 14px rgba(80, 112, 64, 0.25);
        }

        .tournament-window__name {
            margin: 0.15em 0 0.5em;

            color: #000000;
            font-size: 1.5em;
            font-weight: 700;
            text-align: center;

        }

        .tournament-window__image-wrapper {
            width: 100%;
            aspect-ratio: 4 / 5;

            overflow: hidden;

            border: 2px solid #41444b;
            border-radius: 10px;

            background: #e8dfd0;
        }

        .tournament-window__image {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;
        }

        .tournament-window__image-wrapper:hover .tournament-window__image {
            object-fit: contain;
        }

        .tournament-window__date {
            margin: 0 0 0.3em;

            color: #666666;
            font-weight: 600;
            text-align: center;
        }

        @media (max-width: 600px) {
            .tournament-window {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.75em;
            }

            .tournament-window__link {
                padding: 8px;
            }
        }

    </style>
</head>

<body>

<a th:fragment="tournament(id, name, date, image_url)"
   class="tournament-window__link"
   th:href="@{'/tournament/' + ${id}}">

    <div class="tournament-window__name"
         th:text="${name}">
        Tournament name
    </div>

    <div class="tournament-window__image-wrapper">

        <img class="tournament-window__image"
             th:src="${image_url}"
             th:alt="${name}">

    </div>

    <div class="tournament-window__name"
         th:text="${name}">
        Tournament name
    </div>

    <div class="tournament-window__date"
         th:text="${date}">
        2026-09-24
    </div>

</a>

</body>
</html>
