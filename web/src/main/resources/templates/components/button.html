<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .button {
            --button-color: #6b7280;
            --button-color-dark: #4b5563;
            --button-glow: rgba(107, 114, 128, 0.35);

            --button-color-hover: #7b808a;
            --button-color-dark-hover: #5a5e68;
            --button-glow-hover: rgba(123, 128, 138, 0.45);

            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            padding: 9px 18px;

            border: 1px solid var(--button-color-dark);
            border-radius: 8px;

            background: var(--button-color);
            color: #fff;

            font: inherit;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                    0 3px 0 var(--button-color-dark),
                    0 8px 18px rgba(0, 0, 0, 0.25);
        }

        .button:hover {
            background: var(--button-color-hover);
            border-color: var(--button-color-dark-hover);

            box-shadow:
                    0 2px 0 var(--button-color-dark-hover),
                    0 5px 12px rgba(0, 0, 0, 0.18),
                    0 0 14px var(--button-glow-hover);
        }

        .button--confirm {
            --button-color: #507040;
            --button-color-dark: #17630e;
            --button-glow: rgba(36, 145, 22, 0.45);

            --button-color-hover: #1f7716;
            --button-color-dark-hover: #1d7413;
            --button-glow-hover: rgba(46, 170, 29, 0.55);
        }

        .button--option {
            --button-color: #777b84;
            --button-color-dark: #555861;
            --button-glow: rgba(119, 123, 132, 0.4);

            --button-color-hover: #898e98;
            --button-color-dark-hover: #656a74;
            --button-glow-hover: rgba(137, 142, 152, 0.5);
        }

        .button--danger {
            --button-color: #b32222;
            --button-color-dark: #791515;
            --button-glow: rgba(179, 34, 34, 0.45);

            --button-color-hover: #cc2d2d;
            --button-color-dark-hover: #8f1a1a;
            --button-glow-hover: rgba(204, 45, 45, 0.55);
        }

    </style>
</head>

<body>

<button
        th:fragment="button(text, type)"
        type="button"
        class="button"
        th:classappend="' button--' + ${type}"
        th:text="${text}">
    Button
</button>

</body>
</html>
