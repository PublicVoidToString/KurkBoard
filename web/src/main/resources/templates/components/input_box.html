<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <style th:fragment="styles">

        .input {
            display: flex;
            margin-bottom: 0.5em;

            font: inherit;
            font-weight: 700;
            width: fit-content;
        }

        .input__label {
            display: flex;
            align-items: center;
            margin-right: 0.5em;
            font-size: 1.2em;
        }

        .input__content {
            display: flex;
            flex-direction: column;
        }

        .input__field {
            padding: 8px 8px;
            border: 2px solid #41444b;
            border-radius: 10px;
            background: #fff2dd;
            color: #000000;
            font: inherit;
            font-size: 1.05em;
            outline: none;
        }

        .input__field::placeholder {
            color: #777777;
        }

        .input__field:focus {
            border-color: #507040;
            box-shadow: 0 0 3px 4px rgba(80, 112, 64, 0.25);
        }

        .input__hint {
            color: #666666;
            font-size: 0.95rem;
        }

    </style>
</head>

<body>

<div th:fragment="input(label, name, type, placeholder, value)"
     class="input">

    <label class="input__label"
           th:for="${name}"
           th:text="${label}">
        Label
    </label>

    <div class="input__content">

        <input class="input__field"
               th:id="${name}"
               th:name="${name}"
               th:type="${type}"
               th:placeholder="${placeholder}"
               th:value="${value}">

    </div>

</div>

</body>
</html>
